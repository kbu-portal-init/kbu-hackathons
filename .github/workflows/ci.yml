name: Continuous Integration

on:
    pull_request:
        branches:
            - dev
            - main
    push:
        branches:
            - dev


concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Lint, Typecheck & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10.27.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Biome Lint Check
              run: pnpm lint

            - name: TypeScript Typecheck
              run: pnpm exec tsc --noEmit

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                path: .next/cache
                key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
                restore-keys: |
                  nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

            - name: Next.js Production Build
              run: pnpm build

    storage-live:
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        name: R2 Live Storage Test
        runs-on: ubuntu-latest
        environment: r2-integration
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Install pnpm
            uses: pnpm/action-setup@v4
            with:
              version: 10.27.0

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 24
              cache: pnpm

          - name: Install dependencies
            run: pnpm install --frozen-lockfile

          # Check the environment variable here instead of the job level
          - name: Run R2 live storage test
            if: ${{ vars.RUN_R2_INTEGRATION_TESTS == 'true' }}
            run: pnpm test:storage:live
            env:
              RUN_R2_INTEGRATION_TESTS: ${{ vars.RUN_R2_INTEGRATION_TESTS }}
              R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
              R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
              R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
              NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
