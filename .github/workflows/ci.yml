name: Continuous Integration

on:
    pull_request:
        branches:
            - dev
            - main
    push:
        branches:
            - dev


concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Lint, Typecheck & Build
        runs-on: ubuntu-latest
        env:
            NEXT_PUBLIC_APP_URL: http://localhost:3000
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_SECRET: ci-only-build-secret-do-not-use-in-production
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kbu_ci
            R2_ENDPOINT: https://ci.example.com
            R2_ACCESS_KEY_ID: ci-access-key
            R2_SECRET_ACCESS_KEY: ci-secret-key
            R2_BUCKET_NAME: ci-bucket
            NEXT_PUBLIC_R2_PUBLIC_URL: ""
            SMTP_HOST: smtp.example.com
            SMTP_PORT: "587"
            SMTP_SECURE: "false"
            SMTP_USER: ci-user
            SMTP_PASSWORD: ci-password
            SMTP_FROM_EMAIL: ci@example.com
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10.27.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Biome Lint Check
              run: pnpm lint

            - name: Unit Tests
              run: pnpm test:unit

            - name: TypeScript Typecheck
              run: pnpm exec tsc --noEmit

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                path: .next/cache
                key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
                restore-keys: |
                  nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

            - name: Next.js Production Build
              run: pnpm build
