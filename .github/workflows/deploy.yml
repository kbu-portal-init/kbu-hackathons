name: Secure Production Deployment

on:
    push:
        branches:
            - main

concurrency:
    group: production-deployment
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    verify:
        name: Code Quality & Build Verification
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10.27.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Biome Lint Check
              run: pnpm lint

            - name: TypeScript Typecheck
              run: pnpm exec tsc --noEmit

            - name: Next.js Production Build
              run: pnpm build

    deploy:
        name: Deploy to Debian 13 Host
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Remote Container Deployment
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                port: ${{ secrets.SERVER_PORT }}
                script_stop: true
                script: |
                    cd /opt/hackathon
                    git fetch origin main
                    git reset --hard ${{ github.sha }}
                    docker compose up -d --build --remove-orphans
                    timeout 60 bash -c 'until curl -sf http://127.0.0.1:3000/ > /dev/null; do sleep 2; done'
                    docker image prune -f
