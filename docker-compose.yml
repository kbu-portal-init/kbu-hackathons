name: kbu-hackathon

services:
  postgres:
    image: postgres:17
    container_name: kbu-hackathon-postgres
    environment:
      POSTGRES_DB: kbu-hackathon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - kbu-hackathon_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  kbu-hackathon_postgres_data: